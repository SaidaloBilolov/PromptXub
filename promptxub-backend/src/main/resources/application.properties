# ===================================================================
# PROMPTXUB - APPLICATION CONFIGURATION (SPRING BOOT 3 & JAVA 21)
# ===================================================================
spring.application.name=promptxub-backend
server.port=${PORT:8080}

# -------------------------------------------------------------------
# NEON.TECH POSTGRESQL (SERVERLESS FREE TIER) & FALLBACK
# -------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-example.eu-central-1.aws.neon.tech/promptxub_db?sslmode=require}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:promptxub_user}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:promptxub_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimized for Neon Serverless Idle Hibernation & Auto-Wakeup
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PromptXubHikariPool

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Hibernate properties (Dynamic dialect auto-detection based on active DataSource)
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# Logging & Diagnostic Configurations
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.orm.jpa=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.com.promptxub.backend=INFO

# -------------------------------------------------------------------
# MULTIPART FILE UPLOAD (Photo & Video for Prompts)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.file-size-threshold=2MB

# -------------------------------------------------------------------
# IMAGEKIT.IO MEDIA STORAGE & CDN
# -------------------------------------------------------------------
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/promptxub}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:public_PHUOaLGx8fOZbLtSqKWIERbPPS0=}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:private_KofG/lsYCUr2lqKebYGhGBqxpZo=}

# -------------------------------------------------------------------
# JWT SECURITY SETTINGS
# -------------------------------------------------------------------
# Minimum 256-bit (32 characters or base64) secret key
promptxub.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
promptxub.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# CORS ORIGINS
# -------------------------------------------------------------------
promptxub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://promptxub.com,https://admin.promptxub.com}
