# ===================================================================
# PROMPTXUB - APPLICATION CONFIGURATION (SPRING BOOT 3 & JAVA 21)
# ===================================================================
spring.application.name=promptxub-backend
server.port=${PORT:8080}

# -------------------------------------------------------------------
# NEON.TECH POSTGRESQL (SERVERLESS FREE TIER)
# -------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-example.eu-central-1.aws.neon.tech/promptxub_db?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:promptxub_user}
spring.datasource.password=${DATABASE_PASSWORD:promptxub_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimized for Neon Serverless Idle Hibernation
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# MULTIPART FILE UPLOAD (Photo & Video for Prompts)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.file-size-threshold=2MB

# -------------------------------------------------------------------
# CLOUDINARY MEDIA CDN
# -------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_api_secret}

# -------------------------------------------------------------------
# JWT SECURITY SETTINGS
# -------------------------------------------------------------------
# Minimum 256-bit (32 characters or base64) secret key
promptxub.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
promptxub.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# CORS ORIGINS
# -------------------------------------------------------------------
promptxub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://promptxub.com,https://admin.promptxub.com}
